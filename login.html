<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion — MailApp</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <h1>📧 MailApp</h1>
    <p class="subtitle" id="modeSubtitle">Connectez-vous pour accéder au tableau de bord</p>

    <form id="loginForm">
      <label>Adresse e-mail</label>
      <input type="email" id="email" required autocomplete="username" />
      <label>Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <button type="submit">Se connecter</button>
      <p id="loginError" class="error-msg"></p>
    </form>

    <form id="registerForm" style="display:none;">
      <label>Adresse e-mail</label>
      <input type="email" id="regEmail" required autocomplete="username" />
      <label>Mot de passe (8 caractères minimum)</label>
      <input type="password" id="regPassword" required minlength="8" autocomplete="new-password" />
      <label id="inviteLabel">Code d'invitation (si demandé)</label>
      <input type="text" id="regInvite" />
      <button type="submit">Créer mon compte</button>
      <p id="registerError" class="error-msg"></p>
    </form>

    <p style="text-align:center; margin-top:1rem; font-size:0.9rem;">
      <a href="#" id="toggleModeLink">Créer un compte</a>
    </p>
  </div>
  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const toggleLink = document.getElementById('toggleModeLink');
    const subtitle = document.getElementById('modeSubtitle');
    let mode = 'login';

    toggleLink.addEventListener('click', (e) => {
      e.preventDefault();
      mode = mode === 'login' ? 'register' : 'login';
      if (mode === 'register') {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        subtitle.textContent = 'Créez votre compte personnel';
        toggleLink.textContent = 'J\'ai déjà un compte';
      } else {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        subtitle.textContent = 'Connectez-vous pour accéder au tableau de bord';
        toggleLink.textContent = 'Créer un compte';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('loginError');
      errEl.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (res.ok) window.location.href = '/';
        else errEl.textContent = data.error || 'Erreur de connexion.';
      } catch (err) {
        errEl.textContent = 'Impossible de contacter le serveur.';
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const inviteCode = document.getElementById('regInvite').value;
      const errEl = document.getElementById('registerError');
      errEl.textContent = '';
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, inviteCode }),
        });
        const data = await res.json();
        if (res.ok) window.location.href = '/';
        else errEl.textContent = data.error || 'Erreur lors de la création du compte.';
      } catch (err) {
        errEl.textContent = 'Impossible de contacter le serveur.';
      }
    });
  </script>
</body>
  </html>
